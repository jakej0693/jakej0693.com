<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JakeJ0693</title>
  <link rel="icon" type="image/png" href="images/Wolf V3.png" />
  <link href="https://fonts.googleapis.com/css2?family=Iceland&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e0e;
      --surface: #161616;
      --border: #222;
      --text: #e8e8e8;
      --muted: #666;
      --accent: #6C3BAA;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 999;
      opacity: 0.4;
    }

    /* Layout */
    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 2rem;
      width: 100%;
    }

    /* Header */
    header {
      padding: 4rem 0 3rem;
      border-bottom: 1px solid var(--border);
      animation: fadeUp 0.6s ease both;
      text-align: center;
    }

    .avatar {
      width: 160px;
      height: 160px;
      border-radius: 14px;
      background: var(--surface);
      border: 1px dashed var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      overflow: hidden;
      position: relative;
      object-fit: cover;
    }

    .avatar svg {
      width: 60%;
      height: 60%;
      opacity: 0.3;
    }

    .avatar-label {
      font-size: 0.55rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      position: absolute;
      bottom: 10px;
    }

    .tag {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.2rem;
      display: block;
    }

    h1 {
      font-family: 'Iceland', monospace;
      font-weight: 800;
      font-size: clamp(4rem, 12vw, 7rem);
      line-height: 0.95;
      letter-spacing: -0.03em;
      color: var(--text);
    }

    h1 span {
      color: var(--accent);
    }

    /* About */
    .about {
      padding: 3.5rem 0;
      animation: fadeUp 0.6s 0.15s ease both;
      text-align: center;
    }

    .section-label {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .about p {
      font-size: 1rem;
      line-height: 1.8;
      color: #aaa;
      max-width: 560px;
      margin-left: auto;
      margin-right: auto;
    }

    .about p + p {
      margin-top: 1.2rem;
    }

    /* Builds */
    .builds {
      padding: 3.5rem 0 4rem;
      border-top: 1px solid var(--border);
      text-align: center;
      animation: fadeUp 0.6s 0.2s ease both;
    }

    .builds-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.25rem;
      margin-top: 0.5rem;
    }

    .build-tile {
      display: block;
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--surface);
      text-decoration: none;
    }

    .build-tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.35s ease;
    }

    .build-tile:hover img {
      transform: scale(1.06);
    }

    .build-tile .tile-label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 0.6rem 0.4rem;
      background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
      font-size: 0.62rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text);
    }

    /* Featured Photos */
    .photos {
      padding: 3.5rem 0 4rem;
      border-top: 1px solid var(--border);
      text-align: center;
      animation: fadeUp 0.6s 0.25s ease both;
    }

    .slideshow {
      position: relative;
      max-width: 560px;
      aspect-ratio: 4 / 3;
      margin: 0.5rem auto 0;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--surface);
    }

    .slideshow img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.9s ease;
    }

    .slideshow img.active {
      opacity: 1;
    }

    .slideshow-dots {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .slideshow-dots button {
      width: 8px;
      height: 8px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: var(--border);
      cursor: pointer;
      transition: background 0.2s;
    }

    .slideshow-dots button.active {
      background: var(--accent);
    }

    /* Footer */
    footer {
      margin-top: auto;
      padding: 2rem 0;
      border-top: 1px solid var(--border);
      animation: fadeUp 0.6s 0.3s ease both;
    }

    footer .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    footer span {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    .social-links {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .social-links a {
      font-size: 0.72rem;
      color: var(--muted);
      text-decoration: none;
      letter-spacing: 0.05em;
      transition: color 0.2s;
    }

    .social-links a:hover {
      color: var(--accent);
    }

    .social-links .discord {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    /* Animation */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Mobile */
    @media (max-width: 480px) {
      header { padding: 2.5rem 0 2rem; }
      .avatar { width: 120px; height: 120px; }
      .builds-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <img class="avatar" src="images/Wolf V3.png" alt="JakeJ0693" />
      <span class="tag">Hit me up on Steam &amp; Xbox</span>
      <h1>Jake<span>J0693</span></h1>
    </header>

    <section class="about">
      <div class="section-label">About</div>
      <p>
        Gamer, tech tinkerer, occasional amatuer photographer.
      </p>
      <p>
        Find me on the platforms below.
      </p>
    </section>

    <section class="builds">
      <div class="section-label">PC Builds</div>
      <div class="builds-grid">
        <a class="build-tile" href="https://pcpartpicker.com/b/48Xypg" target="_blank">
          <img src="images/jake-pc.jpg" alt="Jake's Gaming PC" />
          <span class="tile-label">Jake's PC</span>
        </a>
        <a class="build-tile" href="https://pcpartpicker.com/b/QvVwrH" target="_blank">
          <img src="images/wife-pc.jpg" alt="Wife's Gaming PC" />
          <span class="tile-label">Wife's PC</span>
        </a>
        <a class="build-tile" href="https://pcpartpicker.com/b/mLjZxr" target="_blank">
          <img src="images/htpc.jpg" alt="HTPC" />
          <span class="tile-label">HTPC</span>
        </a>
        <a class="build-tile" href="https://pcpartpicker.com/b/w4GLrH" target="_blank">
          <img src="images/home-server.jpg" alt="Home Server" />
          <span class="tile-label">Home Server</span>
        </a>
      </div>
    </section>
  </div>

  <section class="photos">
    <div class="container">
      <div class="section-label">Featured Photos</div>
      <div class="slideshow">
        <img src="featured-photos/autumn-trees.jpg" class="active" alt="Featured photo 1" />
        <img src="featured-photos/quill-pickle.jpg" alt="Featured photo 2" />
        <img src="featured-photos/grove-arcade.jpg" alt="Featured photo 3" />
        <img src="featured-photos/winston-hall.jpg" alt="Featured photo 4" />
        <img src="featured-photos/asheville-steps.jpg" alt="Featured photo 5" />
        <img src="featured-photos/winston-snow.jpg" alt="Featured photo 6" />
      </div>
      <div class="slideshow-dots">
        <button class="active" aria-label="Show photo 1"></button>
        <button aria-label="Show photo 2"></button>
        <button aria-label="Show photo 3"></button>
        <button aria-label="Show photo 4"></button>
        <button aria-label="Show photo 5"></button>
        <button aria-label="Show photo 6"></button>
      </div>
    </div>
  </section>

  <footer>
    <div class="container">
      <span>© 2026 JakeJ0693</span>
      <div class="social-links">
        <a href="https://steamcommunity.com/id/torqueylemur" target="_blank">Steam</a>
        <a href="https://xbox.com/play/user/jakej0693" target="_blank">Xbox</a>      
        <a href="https://discord.gg/YFXHhbQm3" target="_blank">Discord</a>
        <a href="https://medal.tv/u/jakej0693" target="_blank">Medal</a>
        <a href="https://pcpartpicker.com/user/jakej0693/" target="_blank">PCPartPicker</a>
        <a href="https://instagram.com/jakej0693" target="_blank">Instagram</a>
      </div>
    </div>
  </footer>

  <script>
    (function () {
      const slides = document.querySelectorAll('.slideshow img');
      const dots = document.querySelectorAll('.slideshow-dots button');
      const container = document.querySelector('.slideshow');
      let current = 0;
      let timer;

      function showSlide(index) {
        slides[current].classList.remove('active');
        dots[current].classList.remove('active');
        current = index;
        slides[current].classList.add('active');
        dots[current].classList.add('active');
      }

      function nextSlide() {
        showSlide((current + 1) % slides.length);
      }

      function startAutoplay() {
        timer = setInterval(nextSlide, 4000);
      }

      function stopAutoplay() {
        clearInterval(timer);
      }

      dots.forEach((dot, i) => {
        dot.addEventListener('click', () => {
          showSlide(i);
          stopAutoplay();
          startAutoplay();
        });
      });

      container.addEventListener('mouseenter', stopAutoplay);
      container.addEventListener('mouseleave', startAutoplay);

      startAutoplay();
    })();
  </script>

</body>
</html>
